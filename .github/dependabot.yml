version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
    open-pull-requests-limit: 5
    groups:
      # init/autobuild/analyze must run the same version or CodeQL fails with a config-version mismatch
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
